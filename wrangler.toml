name = "jira-integration"
main = "src/worker.ts"
compatibility_date = "2024-10-01"

[[d1_databases]]
binding = "DB"
database_name = "jira-integration"
database_id = "4d983478-f684-4e8a-bcae-cf909291d963"

# Queue for chaining pipeline phases across separate Worker invocations.
# Each phase gets a fresh subrequest budget, avoiding the "Too many subrequests" error.
# Before deploying: npx wrangler queues create jira-pipeline
[[queues.producers]]
binding = "PIPELINE_QUEUE"
queue = "jira-pipeline"

[[queues.consumers]]
queue = "jira-pipeline"
max_batch_size = 1
max_retries = 2

# Polls every 15 minutes. The scheduled handler checks D1 settings (cron_days,
# cron_hour, cron_minute, cron_timezone) to decide whether to run the pipeline.
# Configure the actual run time via the /cron UI page.
[triggers]
crons = ["*/15 * * * *"]
